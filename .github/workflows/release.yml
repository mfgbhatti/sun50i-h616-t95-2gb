name: release

# Runs only on release tags and manually. Never on push to a branch.
# LibreELEC is built by its own workflow (libreelec.yml): it does not fit a
# free hosted runner, so it must not block this one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (bootloaders + Armbian)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.0"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - run: uv run pytest -m "not integration"
      - name: Tag must equal project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run t95 verify-tag "$GITHUB_REF_NAME"

  bootloader:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bison flex libssl-dev bc swig \
            python3-dev python3-setuptools python3-pyelftools \
            libgnutls28-dev device-tree-compiler openssl make gcc git
      - name: Fetch pinned TF-A and U-Boot
        run: |
          git clone --depth 1 --branch "$(uv run t95 pin bootloader.tfa_ref)" \
            "$(uv run t95 pin bootloader.tfa_repo)" tfa
          git clone --depth 1 --branch "$(uv run t95 pin bootloader.uboot_ref)" \
            "$(uv run t95 pin bootloader.uboot_repo)" u-boot
      - name: Stage board files
        run: uv run t95 stage uboot u-boot
      - name: Build TF-A
        run: make -C tfa CROSS_COMPILE=aarch64-linux-gnu- PLAT=sun50i_h616 DEBUG=0 bl31
      - name: Build U-Boot (eGON)
        run: |
          export BL31="$PWD/tfa/build/sun50i_h616/release/bl31.bin" SCP=/dev/null
          make -C u-boot CROSS_COMPILE=aarch64-linux-gnu- t95_2gb_defconfig
          make -C u-boot CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)"
          mkdir -p out
          cp u-boot/u-boot-sunxi-with-spl.bin "out/$(uv run t95 bootloader-name egon)"
          make -C u-boot distclean
      - name: Build U-Boot (TOC0, throwaway signing key)
        run: |
          export BL31="$PWD/tfa/build/sun50i_h616/release/bl31.bin" SCP=/dev/null
          openssl genrsa -out u-boot/root_key.pem 2048
          make -C u-boot CROSS_COMPILE=aarch64-linux-gnu- t95_2gb_toc0_defconfig
          make -C u-boot CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)"
          cp u-boot/u-boot-sunxi-with-spl.bin "out/$(uv run t95 bootloader-name toc0)"
      - name: Check boot headers
        run: |
          set -e
          egon=$(ls out/*u-boot-egon-*.bin); toc0=$(ls out/*u-boot-toc0-*.bin)
          [ "$(dd if="$egon" bs=1 skip=4 count=8 2>/dev/null)" = "eGON.BT0" ] || { echo "bad eGON header"; exit 1; }
          [ "$(dd if="$toc0" bs=1 count=8 2>/dev/null)" = "TOC0.GLH" ] || { echo "bad TOC0 header"; exit 1; }
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootloader
          path: out/*.bin
          if-no-files-found: error
          retention-days: 1

  armbian:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Fetch pinned Armbian
        run: |
          git clone --depth 1 --branch "$(uv run t95 pin armbian.ref)" \
            "$(uv run t95 pin armbian.repo)" armbian
      - name: Stage board files
        run: uv run t95 stage armbian armbian
      - name: Build
        working-directory: armbian
        run: |
          B="$(uv run --project .. t95 pin armbian.board)"
          BR="$(uv run --project .. t95 pin armbian.branch)"
          REL="$(uv run --project .. t95 pin armbian.release)"
          sudo ./compile.sh requirements
          sudo chown -R "$USER:$USER" .
          ./compile.sh build BOARD="$B" BRANCH="$BR" RELEASE="$REL" \
            KERNEL_CONFIGURE=no BUILD_MINIMAL=yes BUILD_DESKTOP=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz SHARE_LOG=yes EXPERT=yes
      - name: Check dtb is shipped and collect image
        run: |
          set -e
          deb=$(ls armbian/output/debs/linux-dtb-*.deb | head -n1)
          dpkg-deb -c "$deb" | grep -q sun50i-h616-t95-2gb.dtb
          img=$(ls armbian/output/images/*.img.xz | head -n1)
          mkdir -p out
          name="$(uv run t95 name armbian xz)"
          cp "$img" "out/$name"
          (cd out && sha256sum "$name" > "$name.sha256")
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: armbian
          path: out/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: armbian-logs
          path: armbian/output/logs/**
          if-no-files-found: ignore
          retention-days: 3

  release:
    needs: [bootloader, armbian]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version="$(uv run t95 version)"
          tag="v$version"
          ls -l dist
          for f in dist/*; do
            [ "$(stat -c %s "$f")" -lt 2147483648 ] || { echo "$f exceeds 2 GiB"; exit 1; }
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; bump the version"; exit 1
          fi
          uv run t95 notes > notes.md
          gh release create "$tag" dist/* --title "T95 2GB images $version" \
            --notes-file notes.md --target "$GITHUB_SHA"
